<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>informatica — project gallery</title>
<meta name="description" content="A gallery of informatics coursework and experiments by Alexander-288.">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/theme.js"></script>
<style>
  .head { display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-end; justify-content: space-between; }
  .count { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); white-space: nowrap; }

  .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 2.5rem 0 3rem; }
  .filters button {
    font: inherit; font-family: var(--mono); font-size: 0.72rem;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.4rem 0.85rem; border-radius: 0; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 2px solid var(--border);
    transition: color 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
  }
  .filters button:hover { color: var(--text); border-color: var(--text); }
  .filters button[aria-pressed="true"] {
    color: var(--text); border-color: var(--text);
    box-shadow: 4px 4px 0 0 var(--accent);
  }
  .filters button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 0 var(--accent); }
  .filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* the artwork hangs past the card on purpose; clip it at the page edge so it
     can never turn into a horizontal scrollbar */
  body { overflow-x: clip; }

  /* a wider right gutter on this page, so the artwork has somewhere to hang */
  .wrap { padding-right: clamp(1rem, 7vw, 4.5rem); }

  /* ---------- the timeline ---------- */
  .timeline { position: relative; }

  /* the wandering spine, drawn in JS once the rows have been measured */
  .spine {
    position: absolute;
    top: 0; left: 0;
    overflow: visible;
    pointer-events: none;
    color: var(--text);
  }
  .spine .track { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: square; }
  .spine .track.pending { stroke-dasharray: 7 7; opacity: 0.55; }
  .spine .node { fill: var(--bg); stroke: currentColor; stroke-width: 4; }
  .spine .node.done { fill: var(--accent); }
  .spine .node.idea { opacity: 0.5; }
  .spine .cap { fill: currentColor; }

  .row {
    --rail: clamp(52px, 8vw, 96px);
    /* the artwork's size and how far it hangs past the card. The card's right
       padding is derived from both, so text never ends up underneath it, and
       the overhang stays inside the page gutter so the page never scrolls
       sideways. */
    --art: clamp(170px, 23vw, 280px);
    --art-out: clamp(0.75rem, 3.5vw, 3rem);
    position: relative;
    display: grid;
    grid-template-columns: var(--rail) minmax(0, 1fr);
    padding: clamp(1.5rem, 3vw, 2.25rem) 0;
  }

  /* The band behind each row: a couple of soft blobs, masked down to a
     checkerboard so they render as dither rather than as a gradient. Each
     row's blobs are placed from its slug, so every project gets its own
     shape and it stays the same on every load. */
  .band {
    position: absolute;
    inset: 0 calc(-1 * clamp(1rem, 4vw, 2rem));
    z-index: 0;
    overflow: hidden;
    color: var(--text);
    opacity: 0.5;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(90deg, #000 50%, transparent 100%);
    mask-image: linear-gradient(90deg, #000 50%, transparent 100%);
  }

  .noise {
    position: absolute;
    inset: -10%;
    opacity: 0.13;
    background:
      radial-gradient(ellipse var(--b1w, 38%) var(--b1h, 80%) at var(--b1x, 22%) var(--b1y, 45%),
        currentColor 0%, currentColor 22%, transparent 72%),
      radial-gradient(ellipse var(--b2w, 26%) var(--b2h, 60%) at var(--b2x, 62%) var(--b2y, 60%),
        currentColor 0%, transparent 70%);
    /* the dither: a 6px checkerboard punched out of the blobs */
    -webkit-mask-image: repeating-conic-gradient(#000 0% 25%, transparent 0% 50%);
    mask-image: repeating-conic-gradient(#000 0% 25%, transparent 0% 50%);
    -webkit-mask-size: 6px 6px;
    mask-size: 6px 6px;
  }
  :root[data-theme="dark"] .noise { opacity: 0.17; }

  .card {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    padding: clamp(1.4rem, 3vw, 2rem);
    padding-right: calc(var(--art) - var(--art-out) + 1.25rem);
    min-height: 190px;
    text-decoration: none;
    color: inherit;
    background: var(--surface);
    border: 2px solid var(--text);
    border-radius: 0;
    box-shadow: 8px 8px 0 0 var(--card-accent, var(--accent));
    transition: transform 140ms ease, box-shadow 140ms ease;
  }
  .card:hover { transform: translate(-2px, -2px); box-shadow: 12px 12px 0 0 var(--card-accent, var(--accent)); }
  .card:active { transform: translate(2px, 2px); box-shadow: 5px 5px 0 0 var(--card-accent, var(--accent)); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }

  .card h2 { margin: 0; font-size: clamp(1.3rem, 2.6vw, 1.8rem); letter-spacing: -0.02em; line-height: 1.1; }
  .card p { margin: 0; max-width: 46ch; font-size: 0.96rem; line-height: 1.6; color: var(--muted); }

  .meta {
    display: flex; flex-wrap: wrap; gap: 0.45rem 0.8rem;
    margin-top: auto; padding-top: 0.5rem; align-items: center;
  }
  .slug { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
  .when { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }

  .status {
    font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 0.15rem 0.45rem; border: 1px solid currentColor;
  }
  .status.done { color: var(--ok); }
  .status.wip { color: var(--warn); }
  .status.idea { color: var(--muted); }

  .open {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text);
  }
  .open .arrow { transition: transform 140ms ease; }
  .card:hover .open .arrow { transform: translateX(4px); }

  /* the artwork, deliberately larger than the card that holds it */
  .art {
    position: absolute;
    z-index: 2;
    right: calc(-1 * var(--art-out));
    top: 50%;
    width: var(--art);
    transform: translateY(-50%) rotate(-3deg);
    color: var(--text);
    pointer-events: none;
    transition: transform 220ms ease;
  }
  .card:hover + .art, .row:hover .art { transform: translateY(-50%) rotate(0deg) scale(1.04); }
  .art svg { width: 100%; height: auto; display: block; overflow: visible; }
  .art .accent { fill: var(--card-accent, var(--accent)); }

  .empty { padding: 3rem 1rem; text-align: center; color: var(--muted); font-family: var(--mono); font-size: 0.85rem; }

  @media (max-width: 720px) {
    .row { --rail: 34px; --art: clamp(104px, 30vw, 160px); --art-out: 0.5rem; padding: 1.25rem 0; }
    .card { min-height: 0; box-shadow: 6px 6px 0 0 var(--card-accent, var(--accent)); }
    .art { opacity: 0.9; }
    .card p { max-width: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .art, .open .arrow, .filters button { transition: none; }
  }
</style>
</head>
<body>
<button class="theme-toggle" type="button" aria-pressed="false" aria-label="Toggle theme">
  <span class="track"><span class="knob"></span></span>
  <span class="label">light</span>
</button>

<main class="wrap">
  <header class="head">
    <div>
      <p class="eyebrow">Alexander-288 · informatica</p>
      <h1>Project gallery</h1>
      <p class="lede">Everything I build for informatics lives in one repository. Each folder is a self-contained project, and this page is the index. Pick one to open the live demo.</p>
    </div>
    <p class="count" id="count"></p>
  </header>

  <!-- Tag filters, parked for now - drop the comment markers here and in the
       script below to bring them back.
  <div class="filters" id="filters"></div>
  -->
  <div class="timeline" id="timeline"></div>
  <p class="empty" id="empty" hidden>No projects match that filter.</p>

  <footer class="site">
    <span id="generated"></span>
    <a href="index-of.html">index of files</a>
    <a href="https://github.com/Alexander-288/informatica">github.com/Alexander-288/informatica</a>
  </footer>
</main>

<script type="module">
const timeline = document.getElementById('timeline');
const empty = document.getElementById('empty');

let projects = [];
let active = 'all';

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- the band behind each row ----------
// a stable number from a string, so a project's blobs and fallback artwork
// come out the same on every load rather than shuffling
const hash = (s) => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);

// two blobs, positioned and sized from the slug
function bandStyle(project) {
  const h = hash(project.slug);
  const pick = (n, lo, hi) => lo + (hash(project.slug + n) % 1000) / 1000 * (hi - lo);
  return [
    `--b1x:${pick('1x', 8, 38).toFixed(1)}%`,
    `--b1y:${pick('1y', 25, 70).toFixed(1)}%`,
    `--b1w:${pick('1w', 26, 46).toFixed(1)}%`,
    `--b1h:${pick('1h', 60, 105).toFixed(1)}%`,
    `--b2x:${pick('2x', 40, 72).toFixed(1)}%`,
    `--b2y:${pick('2y', 30, 75).toFixed(1)}%`,
    `--b2w:${pick('2w', 16, 32).toFixed(1)}%`,
    `--b2h:${pick('2h', 40, 85).toFixed(1)}%`,
    `--seed:${h % 97}`,
  ].join(';');
}

// ---------- fallback artwork, for a project that ships no card.svg ----------
// A deterministic block composition, so every project has something of its own.
function fallbackArt(project) {
  const h = hash(project.slug);
  const cells = [];
  const shades = [0.3, 0.6, 0.95];
  for (let i = 0; i < 22; i++) {
    const n = hash(project.slug + i);
    const x = (n % 6) * 40 + 10;
    const y = (Math.floor(n / 6) % 6) * 40 + 10;
    const big = n % 5 === 0;
    const accent = n % 6 === 0;
    cells.push(`<rect x="${x}" y="${y}" width="${big ? 70 : 30}" height="30"` +
      (accent ? ' class="accent" fill="currentColor"' : ' fill="currentColor"') +
      ` opacity="${accent ? 1 : shades[n % 3]}"/>`);
  }
  return `<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">` +
    `<rect x="${10 + (h % 3) * 20}" y="10" width="180" height="180" fill="none" stroke="currentColor" stroke-width="3" opacity="0.5"/>` +
    cells.join('') + '</svg>';
}

// ---------- rows ----------
function render() {
  const shown = active === 'all' ? projects : projects.filter((p) => (p.tags ?? []).includes(active));
  empty.hidden = shown.length > 0;

  timeline.innerHTML = `<svg class="spine" id="spine" aria-hidden="true"></svg>` + shown.map((p) => {
    const href = p.demo ?? p.source ?? '#';
    return `
    <div class="row" data-slug="${esc(p.slug)}" style="--card-accent:${esc(p.accent ?? 'var(--accent)')}">
      <div class="band"><div class="noise" style="${bandStyle(p)}"></div></div>
      <div class="rail"></div>
      <a class="card" href="${esc(href)}">
        <h2>${esc(p.title)}</h2>
        <p>${esc(p.description)}</p>
        <div class="meta">
          <span class="status ${esc(p.status)}">${esc(p.status)}</span>
          <span class="slug">${esc(p.slug)}/</span>
          <span class="when">${esc(p.updated ?? '')}</span>
          ${(p.tags ?? []).map((t) => `<span class="tag">${esc(t)}</span>`).join('')}
        </div>
        <span class="open">open <span class="arrow" aria-hidden="true">&#9656;</span></span>
      </a>
      <div class="art" data-graphic="${esc(p.graphic ?? '')}">${p.graphic ? '' : fallbackArt(p)}</div>
    </div>`;
  }).join('');

  loadGraphics();
  drawSpine();
}

// Custom artwork is fetched and inlined rather than used as <img>, so it can
// inherit the page colours and follow the theme.
async function loadGraphics() {
  for (const holder of timeline.querySelectorAll('.art[data-graphic]')) {
    const src = holder.dataset.graphic;
    if (!src || holder.dataset.loaded) continue;
    try {
      const svg = await fetch(src, { cache: 'no-cache' }).then((r) => (r.ok ? r.text() : Promise.reject()));
      // only inline it if it really is an svg document
      if (svg.trim().startsWith('<svg')) {
        holder.innerHTML = svg;
        holder.dataset.loaded = '1';
      }
    } catch {
      holder.innerHTML = fallbackArt({ slug: holder.closest('.row').dataset.slug, tags: [] });
      holder.dataset.loaded = '1';
    }
  }
}

// ---------- the spine ----------
// A commit graph that refuses to run straight: each node sits at its own offset
// across the rail and the segments between them step, slant or drop.
function drawSpine() {
  const spine = document.getElementById('spine');
  const rows = [...timeline.querySelectorAll('.row')];
  if (!spine || !rows.length) return;

  const box = timeline.getBoundingClientRect();
  const rail = rows[0].querySelector('.rail').getBoundingClientRect().width;
  const pad = Math.min(14, rail * 0.22);
  const usable = Math.max(1, rail - pad * 2);

  // where each node sits across the rail, as a fraction, cycling so a long list
  // keeps wandering instead of settling into a straight line
  const lanes = [0.5, 0.22, 0.78, 0.36, 0.64, 0.14];

  const nodes = rows.map((row, i) => {
    const card = row.querySelector('.card').getBoundingClientRect();
    return {
      x: Math.round(pad + lanes[i % lanes.length] * usable),
      y: Math.round(card.top - box.top + Math.min(48, card.height / 2)),
      status: row.querySelector('.status')?.textContent.trim() ?? 'wip',
    };
  });

  spine.setAttribute('viewBox', `0 0 ${Math.round(rail)} ${Math.round(box.height)}`);
  spine.setAttribute('preserveAspectRatio', 'none');
  spine.style.width = `${Math.round(rail)}px`;
  spine.style.height = `${Math.round(box.height)}px`;

  const parts = [];

  // a stub above the first node and below the last, so the line runs off the page
  parts.push(`<path class="track" d="M${nodes[0].x} 0V${nodes[0].y}"/>`);
  const last = nodes[nodes.length - 1];
  parts.push(`<path class="track pending" d="M${last.x} ${last.y}V${Math.round(box.height)}"/>`);

  for (let i = 0; i < nodes.length - 1; i++) {
    const a = nodes[i];
    const b = nodes[i + 1];
    const dx = b.x - a.x;
    const gap = b.y - a.y;
    const style = hash(`${a.x}:${b.y}`) % 3;
    let d;

    if (dx === 0) {
      d = `M${a.x} ${a.y}V${b.y}`;
    } else if (style === 0) {
      // right angles: down, across, down
      const mid = a.y + Math.round(gap * 0.55);
      d = `M${a.x} ${a.y}V${mid}H${b.x}V${b.y}`;
    } else if (style === 1) {
      // a 45 degree slant, squared off at both ends
      const run = Math.abs(dx);
      const start = a.y + Math.max(0, Math.round(gap * 0.3) - run / 2);
      d = `M${a.x} ${a.y}V${start}L${b.x} ${start + run}V${b.y}`;
    } else {
      // a small detour past the target lane and back
      const over = b.x + Math.sign(dx) * Math.min(12, usable * 0.12);
      const first = a.y + Math.round(gap * 0.35);
      const second = a.y + Math.round(gap * 0.7);
      d = `M${a.x} ${a.y}V${first}H${over}V${second}H${b.x}V${b.y}`;
    }
    parts.push(`<path class="track" d="${d}"/>`);
  }

  // nodes last, so they sit on top of the line
  for (const n of nodes) {
    parts.push(`<rect class="node ${n.status}" x="${n.x - 8}" y="${n.y - 8}" width="16" height="16"/>`);
  }

  spine.innerHTML = parts.join('');
}

// ---------- filters ----------
// Parked, not deleted. Uncomment this block, the markup above and the
// renderFilters() call at the bottom to put the tag buttons back.
/*
const filters = document.getElementById('filters');

function renderFilters() {
  const tags = [...new Set(projects.flatMap((p) => p.tags ?? []))].sort();
  filters.innerHTML = ['all', ...tags]
    .map((t) => `<button type="button" data-tag="${esc(t)}" aria-pressed="${t === active}">${esc(t)}</button>`)
    .join('');
}

filters.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  active = btn.dataset.tag;
  renderFilters();
  render();
});
*/

const redraw = () => requestAnimationFrame(drawSpine);
window.addEventListener('resize', redraw);
document.addEventListener('themechange', redraw);
document.fonts?.ready.then(redraw);

// ---------- load ----------
try {
  const data = await fetch('projects.json', { cache: 'no-cache' }).then((r) => r.json());
  projects = data.projects ?? [];
  document.getElementById('count').textContent = `${data.count ?? projects.length} project${projects.length === 1 ? '' : 's'}`;
  if (data.generated) {
    document.getElementById('generated').textContent = `index generated ${new Date(data.generated).toISOString().slice(0, 10)}`;
  }
  // renderFilters();
  render();
} catch (err) {
  timeline.innerHTML = '';
  empty.hidden = false;
  empty.textContent = 'Could not load projects.json. Open this page over http, not file://';
}
</script>
</body>
</html>
