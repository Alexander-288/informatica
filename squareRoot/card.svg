<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
  <!--
    Heron's method, drawn honestly: every rectangle here has the same area.
    Each step replaces x with the average of x and n/x, so the rectangle of
    area n gets less and less oblong until it settles on the square of side
    sqrt(n). The sides below are the real iterates for n = 10000, x0 = 250:
    250x40, 145x69, 107x93.5, then 100x100.

    The radical is a staircase of 12px blocks laid on a 12px pitch, and every
    block shares a full edge with the next one. Blocks that only met at their
    corners left hairline gaps once the card tilts it.
  -->
  <defs>
    <pattern id="sr-dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="currentColor"/>
      <rect x="4" y="4" width="4" height="4" fill="currentColor"/>
    </pattern>
  </defs>

  <!-- the iterates, converging inward -->
  <g stroke="currentColor" stroke-linejoin="miter">
    <rect x="5" y="110" width="250" height="40" stroke-width="2" opacity="0.3"/>
    <rect x="57.5" y="95.5" width="145" height="69" stroke-width="3" opacity="0.5"/>
    <rect x="76.5" y="83" width="107" height="93.5" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- the limit: a 100 x 100 square, filled with the site's dither -->
  <rect x="80" y="80" width="100" height="100" fill="url(#sr-dither)" opacity="0.5"/>
  <rect x="80" y="80" width="100" height="100" stroke="currentColor" stroke-width="5"/>

  <!-- The radical, as one outlined shape rather than a row of blocks.
       Abutting rects seam along their shared edges once the SVG is scaled,
       which showed up as gaps in the staircase; a single path has no
       internal edges to seam. Still on the same 12px pitch. -->
  <path class="accent" fill="currentColor" d="M6 54 L30 54 L30 66 L42 66 L42 78 L54 78 L54 54 L66 54 L66 18 L126 18 L126 30 L78 30 L78 66 L66 66 L66 90 L54 90 L54 102 L42 102 L42 90 L30 90 L30 78 L18 78 L18 66 L6 66 Z"/>

  <!-- the point everything converges on -->
  <rect class="accent" x="124" y="124" width="12" height="12" fill="currentColor"/>
</svg>
