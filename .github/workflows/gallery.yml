name: Build gallery and file index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan project folders
        run: node scripts/build-gallery.mjs

      - name: Scan the file tree
        run: node scripts/build-tree.mjs

      - name: Commit the generated indexes if they changed
        run: |
          if git diff --quiet -- projects.json tree.json; then
            echo "No change to projects.json or tree.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json tree.json
          git commit -m "chore: regenerate gallery index [skip ci]"
          git push
